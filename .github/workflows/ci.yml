name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript types
        run: bun run check-types

      - name: Run linter
        run: bun run lint

      - name: Run unit & integration tests
        run: bun run test
        env:
          NODE_ENV: test
          PUBLIC_WEB_ORIGIN: https://raktsetu-six.vercel.app
          CORS_ORIGIN: http://localhost:3000,https://raktkhoj.org,https://raktsetu-six.vercel.app
          DONOR_SESSION_SECRET: ci-test-session-secret-key-32chars
          OTP_PEPPER: ci-test-otp-pepper-key-32characters
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Build monorepo packages
        run: bun run build
